name: Validate frontend JavaScript
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Construction geometry and scale evidence unit tests
        run: node --test tests/*.test.cjs
      - name: Stage 0 synthetic wall accuracy baseline (includes expected detector limitations)
        run: node tools/run-wall-baseline.cjs
