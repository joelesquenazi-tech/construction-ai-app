name: Validate frontend JavaScript
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Construction geometry and scale evidence unit tests
        run: node --test tests/*.test.cjs
  offline-ocr:
    # Match the pinned Playwright baseline; ubuntu-latest can change OS versions.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node tests/offline-ocr.cjs
      - run: node tests/dimension-source-browser.cjs
      - run: node tests/dimension-check-browser.cjs
      - run: node tests/dimension-chain-browser.cjs
      - name: Offline scan cancellation and recovery
        run: node tests/scan-jobs-browser.cjs
      - name: Automatic source-backed room shell without manual input
        run: node tests/automatic-room-browser.cjs
      - name: Offline scan timing, touch feedback and diagnostic privacy checks
        run: node tools/benchmark-scans.cjs --smoke

  webkit-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - name: WebKit touch viewport offline OCR, corrections and cache reuse
        run: node tests/offline-ocr.cjs
        env:
          TEST_BROWSER: webkit
      - name: WebKit automatic room reconstruction without manual input
        run: node tests/automatic-room-browser.cjs
        env:
          TEST_BROWSER: webkit
